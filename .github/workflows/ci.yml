name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), reverse=True)
          for k in ios:
              for d in devs[k]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Drunkin.xcodeproj \
            -scheme Drunkin \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*/Drunkin/|Test Case .*(passed|failed)|Executed|\*\* (TEST|BUILD)" build.log
          exit $status

      - name: Release build compiles
        run: |
          xcodebuild build -project Drunkin.xcodeproj -scheme Drunkin -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
